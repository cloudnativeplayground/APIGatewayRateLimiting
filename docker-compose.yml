version: '3.8'

services:
  # Redis Service
  redis:
    image: redis:latest  # Uses the latest Redis image
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # Exposes Redis on port 6379
    networks:
      - gateway-network
    volumes:
      - redis-data:/data  # Persist Redis data

  # API Gateway Service
  api-gateway:
    build:
      context: .  # Use the Dockerfile in the current directory
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"  # Exposes the API Gateway on port 8080
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_REDIS_HOST=redis  # Points to the Redis service in the same network
      - SPRING_REDIS_PORT=6379
    depends_on:
      - redis  # Wait for Redis to be ready before starting API Gateway
    networks:
      - gateway-network

  # Optionally, you can add other services here like backend APIs, databases, etc.
  # Example backend service:
  # backend:
  #   image: your-backend-service
  #   container_name: backend
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - gateway-network

networks:
  gateway-network:
    driver: bridge  # Default network mode, can also use 'host' if necessary

volumes:
  redis-data:
    driver: local  # Persistent volume for Redis

