apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: your-docker-repo/api-gateway:latest  # Replace with your image
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_REDIS_HOST
              value: "redis-service"  # Points to the Redis service name in the cluster
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
              value: "http://backend-service:8081"  # Replace with the actual backend service URI
---
